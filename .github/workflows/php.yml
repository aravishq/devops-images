name: php

# Builds ghcr.io/aravishq/devops/php for every PHP version in PHP_VERSIONS, for
# amd64 and arm64 on native runners, publishes one multi-arch image per version,
# removes images that are no longer needed and checks every published tag.
# The versions in NODE_PHP also get a variant with Node.js (current LTS).
#
# Only runs on main publish and clean up: a push to main, the weekly schedule,
# or "Run workflow" on main. Pull requests and manual runs on other branches
# build and test, and show what the cleanup would delete (dry run).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

# Publishing runs share one group, so they never run at the same time: the
# cleanup of one run could otherwise delete the not yet tagged images of
# another. A newer run does not cancel a run that has started. GitHub keeps at
# most one waiting run per group: a newly queued run replaces the waiting one.
# Pull requests and other branches use their own groups, where a newer run
# cancels the older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.ref == 'refs/heads/main' && 'publish' || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aravishq/devops/php
  # The PHP versions to build. The single place to add or remove a version.
  PHP_VERSIONS: '["8.1", "8.3", "8.4", "8.5"]'
  # PHP versions that also get the php-node variant (8.4-node, 8.4-node26).
  # Each must be in PHP_VERSIONS; the setup job checks that.
  NODE_PHP: '["8.4", "8.5"]'
  # "true" only for runs on main that are not pull requests.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # Hands PHP_VERSIONS to the build and publish matrices (a matrix cannot
  # read env directly) and checks NODE_PHP against it.
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      php: ${{ steps.versions.outputs.php }}
    steps:
      - id: versions
        run: |
          missing=$(jq -nr --argjson php "$PHP_VERSIONS" --argjson node "$NODE_PHP" '$node - $php | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::NODE_PHP contains versions that are not in PHP_VERSIONS: $missing"
            exit 1
          fi
          echo "php=$(jq -c . <<< "$PHP_VERSIONS")" >> "$GITHUB_OUTPUT"

  # Builds and tests one architecture. When publishing, the image is pushed
  # without a tag (by digest) first and that exact digest is tested, so the
  # published image is the tested one; the digests and versions go to publish.
  build:
    name: build (${{ matrix.php }}, ${{ matrix.arch }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.setup.outputs.php) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test php
        run: |
          args=(
            --provenance=false
            --target php
            --build-arg PHP_VERSION=${{ matrix.php }}
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
            --label "org.opencontainers.image.description=PHP ${{ matrix.php }} CLI for CI jobs"
            php
          )
          mkdir -p out

          # Fresh base images, no cache: picks up PHP and Debian updates.
          if [ "$PUBLISH" = true ]; then
            docker buildx build --pull --no-cache "${args[@]}" \
              --metadata-file meta-php.json \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
            image="$IMAGE@$(jq -r '."containerimage.digest"' meta-php.json)"
          else
            docker buildx build --pull --no-cache --load --tag php-test "${args[@]}"
            image=php-test
          fi

          php/test.sh "$image"

          if [ "$PUBLISH" = true ]; then
            docker run --rm "$image" php -r 'echo PHP_VERSION;' > out/php-version.txt
            echo "${image#*@}" > out/php.txt
            cat out/php.txt out/php-version.txt
          fi

      - name: Build and test php-node
        if: contains(fromJSON(env.NODE_PHP), matrix.php)
        run: |
          args=(
            --provenance=false
            --target php-node
            --build-arg PHP_VERSION=${{ matrix.php }}
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
            --label "org.opencontainers.image.description=PHP ${{ matrix.php }} CLI with Node.js LTS for CI jobs"
            php
          )

          # The builder is new for every job, so its cache only holds what the
          # previous step built: the php stage is reused unless its base image
          # changed in between (then it is rebuilt, and tested below as well).
          # --pull fetches the current Node LTS.
          if [ "$PUBLISH" = true ]; then
            docker buildx build --pull "${args[@]}" \
              --metadata-file meta-node.json \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
            image="$IMAGE@$(jq -r '."containerimage.digest"' meta-node.json)"
          else
            docker buildx build --pull --load --tag php-node-test "${args[@]}"
            image=php-node-test
          fi

          php/test-node.sh "$image"

          if [ "$PUBLISH" = true ]; then
            docker run --rm "$image" node -p 'process.versions.node' > out/node-version.txt
            docker run --rm "$image" php -r 'echo PHP_VERSION;' > out/node-php-version.txt
            echo "${image#*@}" > out/node.txt
            cat out/node.txt out/node-version.txt out/node-php-version.txt
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.php }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Combines both architectures of a version into the tags <minor> and
  # <patch> (8.4, 8.4.28), and for php-node into <minor>-node and
  # <minor>-node<major> (8.4-node, 8.4-node26). A variant is published only
  # when both architectures were built and tested and have the same PHP (and
  # Node) version. A failing version does not stop the others.
  publish:
    needs: [setup, build]
    if: ${{ !cancelled() && needs.setup.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.setup.outputs.php) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: digest-${{ matrix.php }}-*
          path: digests

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish php
        run: |
          dir=digests/digest-${{ matrix.php }}
          read_file() { cat "$1" 2>/dev/null || true; }
          amd64=$(read_file "$dir-amd64/php.txt")
          arm64=$(read_file "$dir-arm64/php.txt")
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "::error::PHP ${{ matrix.php }} was not built and tested on both architectures; not publishing it"
            ls -R digests 2>/dev/null || echo "no artifacts downloaded"
            exit 1
          fi

          patch=$(read_file "$dir-amd64/php-version.txt")
          if ! [[ "$patch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$patch" != "$(read_file "$dir-arm64/php-version.txt")" ]; then
            echo "::error::amd64 and arm64 report different or invalid PHP versions ('$patch', '$(read_file "$dir-arm64/php-version.txt")'); not publishing"
            exit 1
          fi

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=PHP ${{ matrix.php }} CLI for CI jobs" \
            --tag "$IMAGE:${{ matrix.php }}" \
            --tag "$IMAGE:$patch" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"

      - name: Publish php-node
        if: ${{ !cancelled() && contains(fromJSON(env.NODE_PHP), matrix.php) }}
        run: |
          dir=digests/digest-${{ matrix.php }}
          read_file() { cat "$1" 2>/dev/null || true; }
          amd64=$(read_file "$dir-amd64/node.txt")
          arm64=$(read_file "$dir-arm64/node.txt")
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "::error::PHP ${{ matrix.php }} with Node was not built and tested on both architectures; not publishing it"
            ls -R digests 2>/dev/null || echo "no artifacts downloaded"
            exit 1
          fi

          # Both architectures must have the same Node and PHP versions, also
          # when a new release appears in the middle of a run.
          for file in node-version.txt node-php-version.txt; do
            value=$(read_file "$dir-amd64/$file")
            if ! [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$value" != "$(read_file "$dir-arm64/$file")" ]; then
              echo "::error::amd64 and arm64 report different or invalid versions in $file ('$value', '$(read_file "$dir-arm64/$file")'); not publishing"
              exit 1
            fi
          done
          version=$(read_file "$dir-amd64/node-version.txt")
          major=${version%%.*}

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=PHP ${{ matrix.php }} CLI with Node.js $major for CI jobs" \
            --tag "$IMAGE:${{ matrix.php }}-node" \
            --tag "$IMAGE:${{ matrix.php }}-node$major" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"

  # Deletes untagged images older than a day (earlier builds; the day also
  # protects the digests of a run that is still publishing), and patch and
  # pinned Node tags (8.4.27, 8.4-node26) six months after their package
  # version was last updated. Images with a minor tag (8.4, 8.4-node) are
  # always excluded. Also runs when a publish failed, so one broken version
  # does not stop the cleanup. A dry run unless this run publishes.
  #
  # Only whole images are deleted: no rule removes one tag from an image that
  # keeps another tag. dataaxiom/ghcr-cleanup-action v1.2.2 can delete the
  # whole image in that case (fixed on its main branch, not yet released).
  cleanup:
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: devops/php
          delete-untagged: true
          exclude-tags: '^\d+\.\d+(-node)?$'
          use-regex: true
          older-than: 1 day
          validate: true
          dry-run: ${{ env.PUBLISH != 'true' }}

      - name: Delete patch and pinned Node tags older than six months
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: devops/php
          delete-tags: '^\d+\.\d+(\.\d+|-node\d+)$'
          exclude-tags: '^\d+\.\d+(-node)?$'
          use-regex: true
          older-than: 6 months
          validate: true
          dry-run: ${{ env.PUBLISH != 'true' }}

  # Checks the published tags independently of the cleanup action, whose own
  # validation only warns. Every expected minor tag must exist, and every tag
  # must resolve to an image with linux/amd64 and linux/arm64 whose platform
  # images can be read. Runs after every publishing run, also when publish or
  # cleanup failed.
  verify:
    needs: [publish, cleanup]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Verify tags
        shell: bash
        run: |
          set -euo pipefail
          repo=${IMAGE#ghcr.io/}
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" | jq -er .token)
          curl -fsS -D headers.txt -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/$repo/tags/list?n=1000" > tags.json
          if grep -qi '^link:' headers.txt; then
            echo "::error::The tag list has more than one page; extend this check to follow it"
            exit 1
          fi
          tags=$(jq -er '.tags[]' tags.json)

          failed=0
          expected=$(jq -nr --argjson php "$PHP_VERSIONS" --argjson node "$NODE_PHP" '$php[], ($node[] + "-node")')
          for tag in $expected; do
            grep -qxF "$tag" <<< "$tags" || { echo "::error::Expected tag $tag is missing"; failed=1; }
          done

          for tag in $tags; do
            if platforms=$(docker buildx imagetools inspect "$IMAGE:$tag" \
                --format '{{ range $p, $_ := .Image }}{{ $p }} {{ end }}' 2>&1); then
              case "$platforms" in
                *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) echo "ok   $tag: $platforms" ;;
                *) echo "::error::$tag has platforms '$platforms'"; failed=1 ;;
              esac
            else
              echo "::error::$tag cannot be read: $platforms"; failed=1
            fi
          done
          exit $failed
