name: php

# Builds ghcr.io/aravishq/devops/php for every supported PHP version.
# Pull requests only build and test; main, the weekly schedule and manual runs
# also push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aravishq/devops/php

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          docker build --pull --no-cache \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="PHP ${{ matrix.php }} CLI for CI jobs" \
            --tag "$IMAGE:${{ matrix.php }}" \
            php

      - name: Test
        run: php/test.sh "$IMAGE:${{ matrix.php }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          patch=$(docker run --rm "$IMAGE:${{ matrix.php }}" php -r 'echo PHP_VERSION;')
          date=$(date -u +%Y%m%d)
          for tag in "$patch" "${{ matrix.php }}-$date"; do
            docker tag "$IMAGE:${{ matrix.php }}" "$IMAGE:$tag"
          done
          for tag in "${{ matrix.php }}" "$patch" "${{ matrix.php }}-$date"; do
            docker push "$IMAGE:$tag"
          done
