name: php

# Builds ghcr.io/aravishq/devops/php for every supported PHP version, for
# amd64 and arm64 on native runners, and publishes one multi-arch image per
# version. Pull requests only build and test; main, the weekly schedule and
# manual runs also publish.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aravishq/devops/php

jobs:
  # Builds, tests and pushes one architecture as <version>-<arch>, for example
  # 8.4-arm64. These intermediate tags are overwritten on every run.
  build:
    name: build (${{ matrix.php }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4", "8.5"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          docker build --pull --no-cache \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="PHP ${{ matrix.php }} CLI for CI jobs" \
            --label nl.aravis.ci.run-id=${{ github.run_id }} \
            --tag "$IMAGE:${{ matrix.php }}-${{ matrix.arch }}" \
            php

      - name: Test
        run: php/test.sh "$IMAGE:${{ matrix.php }}-${{ matrix.arch }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ matrix.php }}-${{ matrix.arch }}"

  # Combines both architectures of a version into the public tags. A version is
  # only published when both of its builds succeeded in this run, so one broken
  # version does not hold back the others.
  publish:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4", "8.5"]
    steps:
      - name: Publish multi-arch tags
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          src="$IMAGE:${{ matrix.php }}"

          for arch in amd64 arm64; do
            run_id=$(docker buildx imagetools inspect "$src-$arch" \
              --format '{{ index .Image.Config.Labels "nl.aravis.ci.run-id" }}')
            if [ "$run_id" != "${{ github.run_id }}" ]; then
              echo "::error::$src-$arch was not built in this run; not publishing ${{ matrix.php }}"
              exit 1
            fi
          done

          patch=$(docker buildx imagetools inspect "$src-amd64" \
            --format '{{ range .Image.Config.Env }}{{ println . }}{{ end }}' \
            | sed -n 's/^PHP_VERSION=//p')
          date=$(date -u +%Y%m%d)

          docker buildx imagetools create \
            --tag "$src" \
            --tag "$IMAGE:$patch" \
            --tag "$src-$date" \
            "$src-amd64" "$src-arm64"
